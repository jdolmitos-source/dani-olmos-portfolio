<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoe Last Platform</title>

  <!-- Inter typeface -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Design tokens must load before base/components so variables are available -->
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
</head>
<body>
  <!-- The router mounts every view inside this node -->
  <div id="app" class="app-shell"></div>

  <!-- Lucide icons: not wired up anywhere in the app yet (no
       `data-lucide` usage in any component/view as of this phase). Add
       back with `defer` (never without it — see git history / README
       "Patch notes" for why) once icons are actually needed. Keeping an
       unused external script here was a real point of failure with no
       upside: if unpkg.com is ever slow/unreachable, it could hang the
       whole page for a feature nothing was using. -->

  <script type="module" src="/src/core/main.js"></script>
</body>
</html>
